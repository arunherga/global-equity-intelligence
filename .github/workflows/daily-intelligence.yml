name: daily-intelligence

# GitHub runs `schedule` on a best-effort basis. It delays ticks under load
# and drops them outright, and a freshly changed cron is routinely ignored for
# its first slot or two - in this repository not one scheduled run fired in
# the first day, across two configured slots.
#
# So each slot is attempted three times, half an hour apart, and a gate makes
# the first attempt that actually lands do the work while the rest exit in
# about ten seconds. The stamp is only written on success, so a failed attempt
# is retried by the next one rather than being swallowed.

on:
  schedule:
    # Midday slot, target 11:48 IST. Attempts at 11:48, 12:18, 12:48 IST.
    - cron: "18,48 6 * * *"
    - cron: "18 7 * * *"
    # Evening slot, target 18:44 IST. Attempts at 18:44, 19:14, 19:44 IST.
    - cron: "14,44 13 * * *"
    - cron: "14 14 * * *"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Restrict to one ticker or a comma-separated list (blank = all 10)"
        required: false
        default: ""
      backfill_days:
        description: "Historical backfill window in days (0 = normal daily run)"
        required: false
        default: "0"
      slice_days:
        description: "Backfill slice size in days"
        required: false
        default: "14"
      dry_run:
        description: "Run without writing anything"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Never let a retry start while the attempt before it is still committing.
  group: daily-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The event store and the seen-article file are read before they are
          # written, so the run needs the previous state - and the gate needs
          # the heartbeat committed by the previous attempt.
          fetch-depth: 0

      - name: Has this slot already run?
        id: gate
        run: |
          set -euo pipefail
          # Derive the slot from WHICH CRON FIRED, not from the clock.
          # GitHub delivers these 4-6 hours late, so the midday crons
          # (06:18-07:18 UTC) actually arrive around 11:55 UTC. A wall-clock
          # rule called that "evening", which stamped the evening slot and
          # made the real evening attempts skip - so only one of the two
          # daily runs ever executed.
          CRON="${{ github.event.schedule }}"
          CRON_HOUR="$(echo "$CRON" | awk '{print $2}')"
          case "$CRON_HOUR" in
            6|7)   SLOT=midday ;;
            13|14) SLOT=evening ;;
            *)     SLOT=manual ;;
          esac
          echo "cron=${CRON:-none} hour_field=${CRON_HOUR:-none} slot=$SLOT"
          STAMP="$(date -u +%F)-$SLOT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT"   >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run - not gated"
            # Prefixed so a manual run is still visible in the heartbeat but
            # does not make the gate skip that day's scheduled slot.
            echo "heartbeat_stamp=manual-$STAMP" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif [ -f data/last_run.json ] && grep -q "\"stamp\": \"$STAMP\"" data/last_run.json; then
            echo "$STAMP already completed by an earlier attempt; skipping"
            echo "heartbeat_stamp=$STAMP" >> "$GITHUB_OUTPUT"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "$STAMP not yet completed; running"
            echo "heartbeat_stamp=$STAMP" >> "$GITHUB_OUTPUT"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the intelligence pipeline
        id: run
        if: steps.gate.outputs.run == 'yes'
        env:
          # The deterministic pipeline needs no credentials. These are read
          # only if ai.enabled is turned on in config.yaml.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          ARGS="--verbose"
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            ARGS="$ARGS --ticker ${{ github.event.inputs.ticker }}"
          fi
          if [ "${{ github.event.inputs.backfill_days }}" != "" ] && \
             [ "${{ github.event.inputs.backfill_days }}" != "0" ]; then
            ARGS="$ARGS --backfill-days ${{ github.event.inputs.backfill_days }}"
            ARGS="$ARGS --slice-days ${{ github.event.inputs.slice_days }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "running: python -m src.main $ARGS"
          # A source failing must not fail the workflow; the run records it in
          # the report's Run Diagnostics section and carries on.
          python -m src.main $ARGS 2>&1 | tee run.log

      - name: Record the heartbeat
        # Written on every completed run, including one that found no news.
        # Without it there is no way to tell a schedule that never fired from
        # a run that fired and had nothing to commit - which is exactly the
        # ambiguity that made the missing runs hard to diagnose.
        if: steps.gate.outputs.run == 'yes' && steps.run.outcome == 'success' && github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p data
          cat > data/last_run.json <<JSON
          {
            "stamp": "${{ steps.gate.outputs.heartbeat_stamp }}",
            "slot": "${{ steps.gate.outputs.slot }}",
            "event": "${{ github.event_name }}",
            "finished_utc": "$(date -u +%FT%TZ)",
            "run_id": "${{ github.run_id }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          cat data/last_run.json

      - name: Record the failure
        # Job logs need admin rights to download, so a crash was invisible
        # from outside. The tail of the run is committed instead, which any
        # clone can read.
        if: steps.gate.outputs.run == 'yes' && steps.run.outcome == 'failure'
        run: |
          mkdir -p data
          python - <<'PY'
          import json, pathlib, datetime
          tail = ""
          log = pathlib.Path("run.log")
          if log.exists():
              tail = "\n".join(log.read_text(errors="replace").splitlines()[-200:])
          pathlib.Path("data/last_error.json").write_text(json.dumps({
              "stamp": "${{ steps.gate.outputs.stamp }}",
              "failed_utc": datetime.datetime.utcnow().isoformat() + "Z",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "log_tail": tail,
          }, indent=2))
          PY
          cat data/last_error.json

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit the failure record
        if: steps.gate.outputs.run == 'yes' && steps.run.outcome == 'failure'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_error.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record failed run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "### Intelligence run"
            echo "- slot: \`${{ steps.gate.outputs.stamp }}\`"
            echo "- gate: \`${{ steps.gate.outputs.run }}\`"
            if [ "${{ steps.gate.outputs.run }}" = "no" ]; then
              echo ""
              echo "This slot had already been completed by an earlier attempt."
            else
              echo '```'
              tail -25 run.log 2>/dev/null || echo "no log produced"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the report, the event data and the heartbeat
        if: steps.gate.outputs.run == 'yes' && steps.run.outcome == 'success' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/ || true
          if git diff --cached --quiet; then
            echo "nothing changed; no commit"
            exit 0
          fi
          git commit -m "Intelligence report for $(date -u +%Y-%m-%d) (${{ steps.gate.outputs.slot }})"
          # Another attempt, or the other slot, may have pushed meanwhile.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && break
            sleep 5
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"
