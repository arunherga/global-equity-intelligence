# ---------------------------------------------------------------------------
# global-equity-intelligence :: RUNTIME CONFIGURATION
# Configuration over hardcoding: behaviour changes belong here, not in code.
# ---------------------------------------------------------------------------

run:
  timezone: Asia/Kolkata
  lookback_hours: 36          # how far back a normal run looks
  max_queries_per_ticker: 26  # cap on auto-generated queries per company
  max_articles_per_query: 25
  language: en

http:
  timeout_seconds: 20
  max_retries: 2
  backoff_seconds: 1.5
  user_agent: "global-equity-intelligence/1.0 (personal research; +https://github.com/)"
  per_request_delay_seconds: 0.6
  verify_tls: true

sources:
  google_news:
    enabled: true
    base_url: "https://news.google.com/rss/search"
    hl: en-IN
    gl: IN
    ceid: "IN:en"
  gdelt:
    # DISABLED after the live run of 2026-09-22: 6 queries, 154 seconds, zero
    # articles. GDELT answered with a non-JSON error page ("no articles key in
    # response") and then refused outright. Re-enable to retry - the collector
    # and its tests are intact and it costs nothing to leave in place.
    enabled: false
    base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    max_records: 40
    # GDELT is used mainly for INTERNATIONAL exposure topics.
    international_only: true
  nse:
    enabled: true
    announcements_url: "https://www.nseindia.com/api/corporate-announcements"
    base_url: "https://www.nseindia.com"
    # NSE frequently blocks datacentre IPs (incl. GitHub Actions runners).
    # A failure here is recorded in Run Diagnostics and never aborts the run.
    treat_failure_as_fatal: false
  bse:
    enabled: true
    announcements_url: "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w"
    base_url: "https://www.bseindia.com"
    treat_failure_as_fatal: false
  rss:
    enabled: true
  company_ir:
    enabled: true
  regulators:
    enabled: true
  government:
    enabled: true

# Generic + sector feeds. Each entry declares the exposure topics it serves so
# the pipeline knows which watchlist companies to test the articles against.
feeds:
  general:
    # Business Standard removed: 403 from GitHub Actions runners on every
    # attempt (2026-09-22). Datacentre-IP blocking that no User-Agent fixes.
    # No coverage is lost - Google News carries the same publisher.
    - name: The Hindu BusinessLine Markets
      url: https://www.thehindubusinessline.com/markets/feeder/default.rss
      source_type: established_newspaper
    - name: Moneycontrol Business
      url: https://www.moneycontrol.com/rss/business.xml
      source_type: established_newspaper
    - name: Livemint Companies
      url: https://www.livemint.com/rss/companies
      source_type: established_newspaper

  solar:
    - name: PV Magazine
      url: https://www.pv-magazine.com/feed/
      source_type: specialized_trade_publication
      tickers: [WAAREEENER]
    - name: PV Magazine India
      url: https://www.pv-magazine-india.com/feed/
      source_type: specialized_trade_publication
      tickers: [WAAREEENER]
    - name: Mercom India
      url: https://www.mercomindia.com/feed
      source_type: specialized_trade_publication
      tickers: [WAAREEENER]
    # SolarQuarter removed: 403 from GitHub Actions runners (2026-09-22).

  energy:
    - name: ETEnergyWorld
      url: https://energy.economictimes.indiatimes.com/rss/topstories
      source_type: specialized_trade_publication
      tickers: [COALINDIA, WAAREEENER]

  banking:
    - name: ETBFSI
      url: https://bfsi.economictimes.indiatimes.com/rss/topstories
      source_type: specialized_trade_publication
      tickers: [HDFCBANK, TMB]
    - name: RBI Press Releases
      url: https://www.rbi.org.in/pressreleases_rss.xml
      source_type: regulator
      tickers: [HDFCBANK, TMB]

  pharma:
    - name: ETHealthWorld Pharma
      url: https://health.economictimes.indiatimes.com/rss/pharma
      source_type: specialized_trade_publication
      tickers: [SUPRIYA]
    - name: US FDA Press Announcements
      url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
      source_type: regulator
      tickers: [SUPRIYA, FRESHARA]

  technology:
    - name: ETCIO
      url: https://cio.economictimes.indiatimes.com/rss/topstories
      source_type: specialized_trade_publication
      tickers: [KSOLVES]

  infrastructure:
    - name: ETInfra
      url: https://infra.economictimes.indiatimes.com/rss/topstories
      source_type: specialized_trade_publication
      tickers: [JKIPL, MSTCLTD]

  consumer:
    - name: ETRetail
      url: https://retail.economictimes.indiatimes.com/rss/topstories
      source_type: specialized_trade_publication
      tickers: [RAVEL]

