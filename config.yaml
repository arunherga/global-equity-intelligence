scoring:
  # Relationship floor for inclusion in the main report.
  report_min_impact: 5
  high_impact_threshold: 8
  critical_threshold: 13
  # WEAK relationships are suppressed unless unusually important.
  weak_relationship_min_impact: 9
  # Cap for macro-only and sector-only links so broad news cannot dominate.
  macro_relationship_cap: 8
  sector_relationship_cap: 9

clustering:
  # Two articles join the same event if they share tickers, overlap in time,
  # and their titles are similar enough.
  title_similarity_threshold: 0.62
  same_event_window_days: 3
  # An existing stored event can absorb a new article within this window.
  event_update_window_days: 21
  # Threshold for recognising a stored event as the same development. Lower
  # than the intra-run threshold because company + category + window already
  # gate it: a rumour and its confirmation are worded very differently.
  event_update_similarity: 0.55

deduplication:
  title_similarity_threshold: 0.88
  window_days: 5

report:
  directory: reports
  max_events_per_section: 8
  max_watch_items: 5
  # Fold same-topic events (one commodity, one industry theme) into their
  # strongest example once this many pile up in a single section.
  theme_collapse_min: 3
  include_weak_section: false
  show_diagnostics: true

storage:
  events_dir: data/events
  daily_dir: data/daily
  profiles_dir: data/profiles
  backfill_dir: data/backfill
  seen_file: data/seen_articles.json
  seen_retention_days: 45

ai:
  enabled: false
  provider: ollama          # ollama | openai
  model: llama3.1:8b
  base_url: http://localhost:11434
  # Only escalate events that are genuinely worth the tokens.
  min_impact_score: 9
  include_indirect_complex: true
  max_events_per_run: 12
  timeout_seconds: 90
  temperature: 0.1

alerts:
  enabled: false
  min_impact_score: 11
  alert_on_official_filing: true
  channels: []              # console | telegram | email | slack | discord

enrichment:
  enabled: true
  refresh_days: 30
  # Enrichment output is written to data/profiles/<TICKER>.enriched.json and
  # is ALWAYS merged under the manual watchlist values, never over them.
  max_pages_per_company: 6
