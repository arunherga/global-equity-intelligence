# ---------------------------------------------------------------------------
# global-equity-intelligence :: WATCHLIST
#
# This file is the MANUALLY MAINTAINED source of truth for the 10 tracked
# companies. Automated profile enrichment (src/profiles/enrichment.py) writes
# to data/profiles/<TICKER>.enriched.json and NEVER overwrites anything here.
#
# Alias entries may be a plain string, or a mapping:
#   - value:    the phrase to match
#     requires: at least one of these terms must also appear in the article
#     excludes: reject the match if it falls inside one of these phrases
#     strength: primary (full company identity) | secondary (shorthand)
#
# Commodity entries carry a `role`:
#   input      -> the company buys it   (price up  = cost pressure)
#   output     -> the company sells it  (price up  = revenue tailwind)
#   throughput -> the company handles it (volume matters more than price)
# ---------------------------------------------------------------------------

